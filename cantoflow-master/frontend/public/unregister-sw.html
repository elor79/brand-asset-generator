<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearing Service Workers...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        .success { color: #10b981; font-size: 48px; margin-bottom: 20px; }
        .error { color: #ef4444; font-size: 48px; margin-bottom: 20px; }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background: #1d4ed8;
        }
        .log {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        .log-item {
            padding: 5px 0;
            font-size: 14px;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div id="status">
        <div class="success">⏳</div>
        <h1>Clearing Cache & Service Workers...</h1>
        <p>Please wait while we clean up cached data from Open WebUI...</p>
    </div>

    <div class="log" id="log"></div>

    <button onclick="goHome()" id="homeBtn" style="display: none;">
        Go to CantoFlow Home
    </button>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        const homeBtn = document.getElementById('homeBtn');

        function addLog(message, type = 'info') {
            const item = document.createElement('div');
            item.className = 'log-item';
            const icon = type === 'success' ? '✓' : type === 'error' ? '✗' : '→';
            item.innerHTML = `${icon} ${message}`;
            item.style.color = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#6b7280';
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        async function clearEverything() {
            let successCount = 0;
            let errorCount = 0;

            try {
                // 1. Unregister all service workers
                addLog('Checking for service workers...');
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    addLog(`Found ${registrations.length} service worker(s)`);

                    for (let registration of registrations) {
                        addLog(`Unregistering: ${registration.scope}`);
                        await registration.unregister();
                        successCount++;
                        addLog(`✓ Unregistered successfully`, 'success');
                    }
                } else {
                    addLog('Service Workers not supported', 'info');
                }

                // 2. Clear caches
                addLog('Checking for caches...');
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    addLog(`Found ${cacheNames.length} cache(s)`);

                    for (let cacheName of cacheNames) {
                        addLog(`Deleting cache: ${cacheName}`);
                        await caches.delete(cacheName);
                        successCount++;
                        addLog(`✓ Cache deleted`, 'success');
                    }
                } else {
                    addLog('Cache API not supported', 'info');
                }

                // 3. Clear localStorage
                addLog('Clearing localStorage...');
                const localStorageCount = localStorage.length;
                localStorage.clear();
                addLog(`✓ Cleared ${localStorageCount} localStorage item(s)`, 'success');
                successCount++;

                // 4. Clear sessionStorage
                addLog('Clearing sessionStorage...');
                const sessionStorageCount = sessionStorage.length;
                sessionStorage.clear();
                addLog(`✓ Cleared ${sessionStorageCount} sessionStorage item(s)`, 'success');
                successCount++;

                // 5. Clear IndexedDB
                addLog('Checking IndexedDB...');
                if ('indexedDB' in window) {
                    const databases = await indexedDB.databases();
                    addLog(`Found ${databases.length} database(s)`);
                    for (let db of databases) {
                        addLog(`Deleting database: ${db.name}`);
                        indexedDB.deleteDatabase(db.name);
                        successCount++;
                    }
                }

                // Success!
                status.innerHTML = `
                    <div class="success">✅</div>
                    <h1>All Clean!</h1>
                    <p>Successfully cleared ${successCount} item(s)</p>
                    <p><strong>Click the button below to reload CantoFlow</strong></p>
                `;
                homeBtn.style.display = 'block';

            } catch (error) {
                errorCount++;
                addLog(`Error: ${error.message}`, 'error');
                status.innerHTML = `
                    <div class="error">❌</div>
                    <h1>Partial Success</h1>
                    <p>Cleared ${successCount} item(s), ${errorCount} error(s)</p>
                    <p>You may need to manually clear your browser cache</p>
                `;
                homeBtn.style.display = 'block';
            }
        }

        function goHome() {
            window.location.href = '/';
        }

        // Run automatically on load
        clearEverything();
    </script>
</body>
</html>
